services:
  proof-server:
    image: midnightnetwork/proof-server:latest
    container_name: zkai-proof-server
    ports:
      - "6300:6300"
    environment:
      - PORT=6300
    volumes:
      - proof_server_keys:/.cache/midnight/zk-params
    restart: unless-stopped

  bridge:
    image: node:22-alpine
    container_name: zkai-bridge
    working_dir: /app
    volumes:
      - ../bridge:/app
      - ../deploy/compiled:/app/compiled
      - ../deploy/deployment.json:/app/deployment.json
      - ../deploy/.seed:/deploy/.seed:ro
      - ../deploy/.bridge-seed:/deploy/.bridge-seed:ro
      - bridge_leveldb:/app/midnight-level-db
    environment:
      - BRIDGE_PORT=7300
      - PROOF_SERVER_URL=http://proof-server:6300
      - ZKAI_AUTH_URL=${ZKAI_AUTH_URL:-https://zkai.vercel.app}
    ports:
      - "7300:7300"
    command: >
      sh -c "
        npm install --silent &&
        echo 'Waiting for proof server on proof-server:6300...' &&
        until nc -z proof-server 6300 2>/dev/null; do sleep 2; done &&
        echo 'Proof server ready.' &&
        npx tsx src/server.ts
      "
    depends_on:
      - proof-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7300/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s  # wallet sync can take up to 5 min
    restart: unless-stopped

  enclave:
    build: .
    container_name: zkai-enclave
    ports:
      - "8080:8080"
    volumes:
      - ollama_models:/root/.ollama
      - ./.provider_id:/app/.provider_id:ro
    environment:
      - OLLAMA_MODEL=qwen2.5:1.5b
      - GRAMINE_MODE=direct
      - MAX_TOKENS=512
      - HOST=0.0.0.0
      - PORT=8080
      - ZKAI_BRIDGE_URL=http://bridge:7300
      - ZKAI_AUTH_URL=http://192.168.0.103:3000
      - ZKAI_PRICE_PER_REQUEST=${ZKAI_PRICE_PER_REQUEST:-1000}
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Cloudflare Tunnel ──────────────────────────────────────────
  # Gives a public HTTPS endpoint (*.trycloudflare.com) without opening
  # firewall ports or needing a static IP.
  #
  # Enable:  zkai start --tunnel
  #      or: docker compose --profile tunnel up -d
  #
  # After starting, run:  zkai tunnel-url
  #                   or: docker logs zkai-tunnel 2>&1 | grep trycloudflare
  # Copy the https://xxxxx.trycloudflare.com URL and use it as your endpoint:
  #   zkai register --endpoint https://xxxxx.trycloudflare.com
  #
  # Note: trycloudflare.com URLs are temporary and change on each restart.
  # For a permanent URL, set CLOUDFLARE_TUNNEL_TOKEN (from Cloudflare dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zkai-tunnel
    profiles: ["tunnel"]
    # Quick tunnel (no account): temporary https://*.trycloudflare.com URL
    # Named tunnel (permanent): set CLOUDFLARE_TUNNEL_TOKEN in provider/.env
    #   and change command to: tunnel --no-autoupdate run --token $CLOUDFLARE_TUNNEL_TOKEN
    command: tunnel --no-autoupdate --url http://enclave:8080
    depends_on:
      - enclave
    restart: unless-stopped

volumes:
  ollama_models:
  bridge_leveldb:
  proof_server_keys:
