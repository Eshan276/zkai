name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip
        run: python -m ensurepip --upgrade

      - name: Build zipapp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v' from tag
          bash scripts/build-release.sh "$VERSION"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "ZKai CLI v${VERSION}" \
            --notes "$(cat <<'EOF'
## Install

```bash
curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
```

Or download [zkai-${VERSION}.pyz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/zkai-${VERSION}.pyz) and run directly:
```bash
python3 zkai-${VERSION}.pyz --help
```

## Requirements
- Python 3.9+
- Docker + Docker Compose (for provider node operations)
EOF
)" \
            "dist/zkai-${VERSION}.pyz" \
            "dist/zkai.pyz"
